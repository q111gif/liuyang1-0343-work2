  <h1>古筝社活动介绍</h1>

  <p>古筝社每学期会围绕“基础教学、曲目排练、合奏训练、舞台实践、社团交流”开展多项活动。新成员见面会帮助大家快速了解社团文化、部门分工和学期计划；古筝基础教学公开课面向零基础同学，从佩戴义甲、坐姿、基础指法和音阶训练开始，逐步建立练习方法。</p>

  <p>学期中，社团会组织曲目分组排练、重奏与合奏训练、草坪音乐会和期末汇报演出等活动，让成员在不同形式的实践中提升演奏能力与舞台表现力。无论你是有一定基础的演奏者，还是刚刚产生兴趣的新手，都可以在古筝社找到适合自己的参与方式。</p>

  <p>欢迎加入我们，一起在琴声和掌声中度过充实而有温度的大学时光。</p>
